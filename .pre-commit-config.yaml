repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace      # Removes trailing whitespaces
      - id: end-of-file-fixer        # Ensures files end with a newline
      - id: check-yaml               # Validates YAML syntax
      - id: check-added-large-files  # Prevents committing massive files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff                     # Runs the linter and auto-fixes
        args: [ --fix, --extend-select, I ]
      - id: ruff-format              # Reformats the code style
